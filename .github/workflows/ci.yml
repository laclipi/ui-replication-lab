# CI — typecheck, lint, format check, build
# ----------------------------------------
# Single workflow that gates every PR into main.
# If anything in here turns red, the PR cannot merge (when branch
# protection is configured on GitHub for required status checks).
#
# Caching strategy:
#   - actions/setup-node ships with built-in npm caching when you pass
#     `cache: 'npm'`. It keys on package-lock.json automatically.
#   - That alone usually saves ~30-60s per run; no need for explicit cache steps.

name: CI

# When to run
on:
  push:
    branches: [main] # Direct pushes to main run the same gate
  pull_request:
    branches: [main] # Every PR targeting main

# Run only one workflow per branch — saves Actions minutes when force-pushing
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Format · Build
    runs-on: ubuntu-latest

    steps:
      # Pull the repo at the commit being tested
      - name: Checkout
        uses: actions/checkout@v4

      # Node version comes from .nvmrc — single source of truth shared with local devs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm" # Caches ~/.npm based on package-lock.json hash

      # `npm ci` is the deterministic install for CI — uses package-lock.json exactly
      - name: Install dependencies
        run: npm ci

      # Each check runs in its own step so the GitHub Actions UI shows
      # exactly which gate failed at a glance.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
